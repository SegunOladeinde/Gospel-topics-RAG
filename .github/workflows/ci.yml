name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A real Postgres so the tests marked `postgres` run too (they're skipped
    # unless TEST_DATABASE_URL is set). Throwaway credentials, CI only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv publishes only exact version tags (there's no floating v10).
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Python comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          OPENAI_API_KEY: "dummy-key-for-ci"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ClerkProvider needs a well-formed publishable key to prerender. This
      # one is a placeholder (base64 of "example.clerk.accounts.dev$"), not a
      # real key; the build never contacts Clerk.
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
        run: npm run build
