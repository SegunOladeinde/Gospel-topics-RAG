[project]
name = "lds-rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "faiss-cpu>=1.8,<2.0",
    "rank_bm25>=0.2,<1.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.15.0,<5.0",
    "slowapi>=0.1.10,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0,<7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src/backend --cov-fail-under=70"
